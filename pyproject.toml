[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartgrid"
version = "0.1.0"
description = "Day-ahead forecasting and battery dispatch optimisation for the German electricity market"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2.0",
    "pyarrow>=17",
    "requests>=2.32",
    "tzdata>=2024.1",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "google-cloud-bigquery>=3.25",
    "db-dtypes>=1.3",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jupyterlab>=4.2",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "sqlmesh[bigquery]>=0.130",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smartgrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: hits a live external API; deselect with -m 'not network'",
    "cloud: requires BigQuery credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "transform/.cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
